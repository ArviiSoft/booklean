name: Booklean CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · Derleme
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js 22 kur
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: TypeScript kontrolü ve üretim derlemesi
        run: npm run build
